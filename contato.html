      <div class="container header-content">

          <img
            src="assets/images/logo_BairroTech_vs.png"

            width="40"

        <nav>
          <ul class="menu">
            <li><a href="index.html">Home</a></li>

        <!-- Botão do Menu Mobile (Hambúrguer) -->

          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <main>
  <section class="hero sobre-hero">
    <div class="container hero-content">
      <h1>Contato</h1>
      <p>Envie dúvidas, sugestões ou relatos para a equipe do BairroTech.</p>
    </div>
  </section>

  <section class="sobre-secao">
    <div class="container">
      <h2>Fale com a gente</h2>
      <p>Os campos marcados com * são obrigatórios.</p>

      <form id="form-contato" class="formulario" novalidate
            data-mensagem-sucesso="Mensagem enviada com sucesso! Responderemos em breve.">

        <div class="campo">
          <label for="nome">Nome *</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome completo"
                 minlength="3" autocomplete="name" required />
          <span class="mensagem-erro" id="erro-nome"></span>
        </div>

        <div class="campo">
          <label for="email">E-mail *</label>
          <input type="email" id="email" name="email" placeholder="nome@exemplo.com"
                 autocomplete="email" required />
          <span class="mensagem-erro" id="erro-email"></span>
        </div>

        <div class="campo">
          <label for="assunto">Assunto *</label>
          <select id="assunto" name="assunto" required>
            <option value="">Selecione um assunto</option>
            <option value="duvida">Dúvida</option>
            <option value="sugestao">Sugestão</option>
            <option value="relato">Relato de problema</option>
            <option value="outro">Outro</option>
          </select>
          <span class="mensagem-erro" id="erro-assunto"></span>
        </div>

        <div class="campo">
          <label for="mensagem">Mensagem *</label>
          <textarea id="mensagem" name="mensagem" rows="5"
                    placeholder="Escreva sua mensagem" minlength="10" required></textarea>
          <span class="mensagem-erro" id="erro-mensagem"></span>
        </div>

        <button type="submit" class="btn">Enviar mensagem</button>
      </form>

      <div id="mensagem-sucesso" class="mensagem-sucesso" role="status"
           aria-live="polite" hidden></div>
    </div>
  </section>
</main>

    <script src="js/menu.js"></script>
  </body>
</html>
